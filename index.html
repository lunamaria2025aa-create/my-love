<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corazón de Partículas Neón</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas { display: block; }
        #musica { display: none; }
    </style>
</head>
<body>

    <audio id="musica" autoplay loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 1800; // Cantidad equilibrada para que no sea una mancha
        let targetPoints = [];

        // Función del contorno
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 13, y: y * 13 };
        }

        // Función de relleno con "espaciado"
        function getRandomPointInside() {
            while (true) {
                let x = (Math.random() - 0.5) * 500;
                let y = (Math.random() - 0.6) * 500;
                let nx = x / 13;
                let ny = -y / 13;
                let formula = Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * Math.pow(ny, 3);
                
                // El secreto: Solo aceptamos puntos si pasan una prueba de probabilidad
                // Esto evita que se amontonen en el centro muerto.
                if (formula <= 0 && Math.random() > 0.2) {
                    return { x: x, y: y };
                }
            }
        }

        for (let i = 0; i < particleCount; i++) {
            let point = (i < 600) ? getHeartPoint(Math.random() * Math.PI * 2) : getRandomPointInside();
            
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                tx: point.x,
                ty: point.y,
                size: Math.random() * 1.8 + 0.3,
                speed: 0.04 + Math.random() * 0.04,
                alpha: 0.5 + Math.random() * 0.5 // Transparencia individual
            });
        }

        let time = 0;

        function animate() {
            // Borrado limpio para que las partículas se vean como puntos definidos
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            let beat = 1 + Math.sin(time) * 0.12;
            time += 0.06;

            particles.forEach(p => {
                let targetX = canvas.width / 2 + p.tx * beat;
                let targetY = canvas.height / 2 + p.ty * beat;

                p.x += (targetX - p.x) * p.speed;
                p.y += (targetY - p.y) * p.speed;

                // Dibujamos la partícula con un pequeño resplandor individual
                ctx.fillStyle = `rgba(180, 50, 255, ${p.alpha})`; // Morado neón
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                // Añadimos un pequeño brillo solo a las más grandes
                if(p.size > 1.5) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#b432ff";
                } else {
                    ctx.shadowBlur = 0;
                }
            });

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        window.addEventListener('click', () => {
            document.getElementById('musica').play();
        });
    </script>
</body>
</html>
