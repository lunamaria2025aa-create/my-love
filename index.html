<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corazón de Partículas Moradas</title>
    <style>
        /* Fondo negro y sin scrolls */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* Reproductor oculto */
        #musica {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="musica" autoplay loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 600; // Cantidad de partículas
        let targetPoints = [];

        // Ecuación paramétrica del corazón
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 15, y: y * 15 };
        }

        // Crear los puntos del corazón una sola vez
        for (let i = 0; i < particleCount; i++) {
            let t = Math.random() * Math.PI * 2;
            targetPoints.push(getHeartPoint(t));
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: 0.05 + Math.random() * 0.05,
                size: Math.random() * 2 + 1
            });
        }

        let time = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Factor de latido usando Seno
            // El corazón se expande y contrae entre 0.8 y 1.2
            let beat = 1 + Math.sin(time) * 0.2;
            time += 0.1; // Velocidad del latido

            ctx.fillStyle = "rgba(138, 43, 226, 0.8)"; // Color Morado (BlueViolet)

            particles.forEach((p, i) => {
                let target = targetPoints[i];
                
                // Aplicar el latido a los puntos destino
                let targetX = canvas.width / 2 + target.x * beat;
                let targetY = canvas.height / 2 + target.y * beat;

                // Movimiento suave (Interpolación)
                p.x += (targetX - p.x) * p.speed;
                p.y += (targetY - p.y) * p.speed;

                // Dibujar partícula
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // Ajustar tamaño si cambia la ventana
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Nota: Los navegadores modernos bloquean el autoplay. 
        // El usuario debe interactuar con la página para que suene.
        window.addEventListener('click', () => {
            document.getElementById('musica').play();
        });
    </script>
</body>
</html>
</html>
