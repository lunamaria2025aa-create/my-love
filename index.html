<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corazón de Partículas Nítido (Con Intro y Audio)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Fondo negro puro */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        /* Reproductor oculto */
        #musica {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
        Tu navegador no soporta el audio.
    </audio>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        // MUCHA MÁS CANTIDAD PARA RELLENAR
        const particleCount = 10000; 
        
        // --- ESTADOS DE LA ANIMACIÓN ---
        // 0: Explosión inicial
        // 1: Reuniéndose
        // 2: Latiendo
        let animationState = 0; 
        let timeInState = 0; 

        // --- MATEMÁTICAS DEL CORAZÓN (Escala para rellenar) ---
        const ESCALA = 17; // Tamaño del corazón

        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * ESCALA, y: y * ESCALA };
        }

        // Función clave para rellenar UNIFORMEMENTE
        function getRandomPointInside() {
            // Un algoritmo de distribución uniforme
            let point;
            let maxT = Math.PI * 2;
            let iterations = 0;
            while(iterations < 50) { // Límite para evitar bucles infinitos
                iterations++;
                // 1. Generar un ángulo t y un radio r (con distribución uniforme)
                let t = Math.random() * maxT;
                let r = Math.sqrt(Math.random()); // sqrt para corregir la densidad en el centro
                
                // 2. Obtener el punto del contorno en ese t
                let contour = getHeartPoint(t);
                
                // 3. El punto de relleno está r veces más cerca del centro
                point = {
                    x: contour.x * r,
                    y: contour.y * r
                };

                // Opcional: verificación de fórmula matemática para seguridad extra
                // Pero este método es más directo para un relleno uniforme.
                return point;
            }
            return {x: 0, y: 0}; // Fallback
        }

        // --- INICIALIZACIÓN (Fase 0: Explosión) ---
        for (let i = 0; i < particleCount; i++) {
            // Definir destino
            let point = getRandomPointInside();

            // Guardar su destino final (coordenadas relativas al centro)
            const txRel = point.x;
            const tyRel = point.y;

            // Velocidad y dirección de la explosión (empiezan en el centro)
            const angle = Math.random() * Math.PI * 2;
            const force = 10 + Math.random() * 25;

            particles.push({
                x: canvas.width / 2,
                y: canvas.height / 2,
                // Coordenadas relativas al centro para el destino
                txRel: txRel,
                tyRel: tyRel,
                // Guardar coordenadas de destino absolutas (se calculan luego)
                tx: 0, ty: 0,
                // Velocidad de explosión
                vx: Math.cos(angle) * force,
                vy: Math.sin(angle) * force,
                size: Math.random() * 1.5 + 0.3, // Partículas más nítidas y pequeñas
                alpha: Math.random() * 0.4 + 0.6 // Transparencia individual nítida
            });
        }

        let heartBeatTime = 0;

        // --- BUCLE PRINCIPAL ---
        function animate() {
            // Borrado limpio (un rastro muy suave para la intro, pero nítido al final)
            // Cuando ya está latiendo, el rastro debe ser mínimo para evitar borrones.
            let alphaFondo = (animationState === 2) ? 0.3 : 0.2; 
            ctx.fillStyle = `rgba(0, 0, 0, ${alphaFondo})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            timeInState++;

            // --- LÓGICA DE FASES ---
            if (animationState === 0 && timeInState > 30) { 
                animationState = 1;
                timeInState = 0;
            } else if (animationState === 1 && timeInState > 140) { // Tiempo para reunirse
                animationState = 2;
                timeInState = 0;
            }

            // --- COLOR MORADO NÍTIDO ---
            const colorBase = "rgba(180, 50, 255, "; 
            
            // --- DESACTIVAR BRILLO GLOBAL (Solución al borrón) ---
            ctx.shadowBlur = 0; // Adiós al brillo emborronador

            // --- ACTUALIZAR Y DIBUJAR ---
            particles.forEach((p, i) => {
                
                if (animationState === 0) {
                    // FASE 0: Explosión
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.92;
                    p.vy *= 0.92;
                } 
                else if (animationState === 1) {
                    // FASE 1: Reunión (vuelan a su destino)
                    // Calcular el destino absoluto por primera vez
                    p.tx = canvas.width / 2 + p.txRel;
                    p.ty = canvas.height / 2 + p.tyRel;

                    const distX = p.tx - p.x;
                    const distY = p.ty - p.y;
                    // Velocidad de reunión acelerada
                    p.x += distX * 0.05; 
                    p.y += distY * 0.05;
                }
                else if (animationState === 2) {
                    // FASE 2: Latido
                    let beatFactor = 1 + Math.sin(heartBeatTime) * 0.15;
                    
                    // El destino absoluto cambia con el latido
                    let targetX = canvas.width / 2 + p.txRel * beatFactor;
                    let targetY = canvas.height / 2 + p.tyRel * beatFactor;
                    
                    // Movimiento suave final (rápido para que siga el latido)
                    p.x += (targetX - p.x) * 0.2;
                    p.y += (targetY - p.y) * 0.2;
                }

                // Dibujar como un punto definido y nítido
                ctx.fillStyle = colorBase + p.alpha + ")";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Actualizar tiempo del latido si estamos en esa fase
            if (animationState === 2) {
                heartBeatTime += 0.08;
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- LÓGICA DE AUDIO: REPRODUCCIÓN AL CLIC (Obligatorio) ---
        window.addEventListener('click', () => {
            const reproductor = document.getElementById('musica');
            if (reproductor.paused) {
                // Al primer clic, empieza la música
                reproductor.play();
            }
        });
    </script>
</body>
</html>
