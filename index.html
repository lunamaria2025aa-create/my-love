<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Explosión y Corazón Latiendo de Partículas</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #musica {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="musica" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        // Cantidad para que esté bien lleno pero definido
        const particleCount = 2000; 
        
        // --- ESTADOS DE LA ANIMACIÓN ---
        // 0: Explosión inicial
        // 1: Reuniéndose en el corazón
        // 2: Latiendo
        let animationState = 0; 
        let timeInState = 0; // Temporizador

        // --- FUNCIONES MATEMÁTICAS ---
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 15, y: y * 15 }; // Escala 15
        }

        function getRandomPointInsideHeart() {
            while (true) {
                let x = (Math.random() - 0.5) * 600; 
                let y = (Math.random() - 0.6) * 600;
                let nx = x / 15;
                let ny = -y / 15; 
                let formula = Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * Math.pow(ny, 3);
                if (formula <= 0) {
                    return { x: x, y: y };
                }
            }
        }

        // --- INICIALIZACIÓN DE PARTÍCULAS ---
        for (let i = 0; i < particleCount; i++) {
            // Definir su posición destino (el corazón)
            let targetPoint;
            if (i < particleCount * 0.3) { // 30% en el contorno
                targetPoint = getHeartPoint(Math.random() * Math.PI * 2);
            } else { // 70% rellenando
                targetPoint = getRandomPointInsideHeart();
            }

            // Velocidad y dirección de la explosión
            const angle = Math.random() * Math.PI * 2;
            const force = 10 + Math.random() * 20;

            particles.push({
                // Empiezan en el centro
                x: canvas.width / 2,
                y: canvas.height / 2,
                // Guardar su destino final
                tx: canvas.width / 2 + targetPoint.x,
                ty: canvas.height / 2 + targetPoint.y,
                // Velocidad de explosión (fase 0)
                vx: Math.cos(angle) * force,
                vy: Math.sin(angle) * force,
                // Propiedades visuales
                size: Math.random() * 2.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        let heartBeatTime = 0;

        // --- BUCLE DE ANIMACIÓN PRINCIPAL ---
        function animate() {
            // Efecto rastro (trail) para el brillo
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            timeInState++;

            // --- LÓGICA DE FASES ---
            if (animationState === 0 && timeInState > 30) { 
                // Fin de la explosión rápido (medio segundo)
                animationState = 1;
                timeInState = 0;
            } else if (animationState === 1 && timeInState > 120) {
                // Tiempo para reunirse (2 segundos)
                animationState = 2;
                timeInState = 0;
            }

            // --- CONFIGURACIÓN VISUAL (Glow) ---
            const colorMorado = "rgba(180, 50, 255, "; 
            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(180, 50, 255, 0.8)";

            // --- ACTUALIZAR Y DIBUJAR PARTÍCULAS ---
            particles.forEach((p, i) => {
                
                if (animationState === 0) {
                    // FASE 0: Explosión (física simple con rozamiento)
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vx *= 0.92; // Rozamiento
                    p.vy *= 0.92;
                } 
                else if (animationState === 1) {
                    // FASE 1: Reunión (vuelan a su destino)
                    const distX = p.tx - p.x;
                    const distY = p.ty - p.y;
                    // Velocidad de reunión acelerada
                    p.x += distX * 0.04; 
                    p.y += distY * 0.04;
                }
                else if (animationState === 2) {
                    // FASE 2: Latido
                    let beatFactor = 1 + Math.sin(heartBeatTime) * 0.15;
                    // Moverse alrededor de su destino basándose en el latido
                    let targetX = canvas.width / 2 + (p.tx - canvas.width / 2) * beatFactor;
                    let targetY = canvas.height / 2 + (p.ty - canvas.height / 2) * beatFactor;
                    
                    // Pequeño movimiento suave final
                    p.x += (targetX - p.x) * 0.1;
                    p.y += (targetY - p.y) * 0.1;
                }

                // Dibujar
                ctx.fillStyle = colorMorado + p.alpha + ")";
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Actualizar tiempo del latido si estamos en esa fase
            if (animationState === 2) {
                heartBeatTime += 0.08;
            }

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        window.addEventListener('click', () => {
            const reproductor = document.getElementById('musica');
            if (reproductor.paused) {
                reproductor.play();
            }
        });
    </script>
</body>
</html>
