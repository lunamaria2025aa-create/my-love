<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corazón de Neón Morado Latiendo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* Fondo negro puro */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
        }

        #musica {
            display: none;
        }
    </style>
</head>
<body>

    <audio id="musica" autoplay loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        // Aumentamos MUCHO la cantidad para rellenar
        const particleCount = 2500; 
        let targetPoints = [];

        // Ecuación paramétrica para el CONTORNO del corazón
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * 15, y: y * 15 };
        }

        // Función para generar un punto ALEATORIO DENTRO del corazón
        function getRandomPointInsideHeart() {
            // Usamos un bucle de rechazo: generamos puntos en un cuadrado 
            // y solo nos quedamos con los que están dentro de la forma del corazón.
            while (true) {
                // Rango aproximado basado en la escala 15 de getHeartPoint
                let x = (Math.random() - 0.5) * 600; 
                let y = (Math.random() - 0.6) * 600;

                // Normalizamos para la fórmula matemática estándar
                let nx = x / 15;
                let ny = -y / 15; // Invertimos Y para la fórmula

                // Fórmula de la región del corazón: (x²+y²-1)³ - x²y³ <= 0
                let formula = Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * Math.pow(ny, 3);
                
                if (formula <= 0) {
                    return { x: x, y: y };
                }
            }
        }

        // Crear los puntos destino (mezcla de contorno e interior)
        for (let i = 0; i < particleCount; i++) {
            let point;
            if (i < 500) {
                // Primeros 500 puntos para definir bien el borde
                let t = Math.random() * Math.PI * 2;
                point = getHeartPoint(t);
            } else {
                // El resto rellenan el interior
                point = getRandomPointInsideHeart();
            }

            targetPoints.push(point);
            particles.push({
                // Aparecen dispersos por la pantalla
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                // Velocidad aleatoria para que se muevan orgánicamente
                speed: 0.02 + Math.random() * 0.06, 
                size: Math.random() * 2.5 + 0.5 // Tamaños variados
            });
        }

        let time = 0;

        function animate() {
            // clearRect normal borraría el rastro. 
            // Usamos un fillRect negro muy transparente para dejar un rastro suave (trail).
            ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Factor de latido (más pronunciado y suave)
            let beat = 1 + Math.sin(time) * 0.15;
            time += 0.05; // Velocidad del latido

            // --- CONFIGURACIÓN DEL BRILLO (Glow) ---
            // Usamos color neón morado brillante
            const colorMorado = "rgba(191, 0, 255, 0.9)"; 
            ctx.fillStyle = colorMorado;
            
            // Activamos la sombra para el efecto de luz
            ctx.shadowBlur = 15; // Intensidad del desenfoque de luz
            ctx.shadowColor = colorMorado; // Color de la luz

            particles.forEach((p, i) => {
                let target = targetPoints[i];
                
                let targetX = canvas.width / 2 + target.x * beat;
                let targetY = canvas.height / 2 + target.y * beat;

                // Movimiento suave hacia su destino
                p.x += (targetX - p.x) * p.speed;
                p.y += (targetY - p.y) * p.speed;

                // Dibujar partícula
                ctx.beginPath();
                // Partículas un poco más grandes
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Desactivar sombra para el resto de elementos si los hubiera (buena práctica)
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Click para reproducir música (obligatorio en navegadores modernos)
        window.addEventListener('click', () => {
            const reproductor = document.getElementById('musica');
            if (reproductor.paused) {
                reproductor.play();
            }
        });
    </script>
</body>
</html>
